name: Rollback Production Release (Greenfield)

# Phase 6 owner-approved rollback (OP-REC-03/04, AD-14, AD-10, AD-16).
# Bring-up name: this file is named rollback-release-greenfield.yml until
# cutover, when the legacy rollback-release.yml is removed and this file is
# renamed (OP-CUT-02). workflow_dispatch only — rollback intent is never
# push-implied (AD-10). The single dispatch input is the official release id
# `release-NNNN`; digests, tags, ARNs, manifests, and URLs are never entered
# by hand (D2).
#
# Control plane (AD-10 / OP-REC-03/04):
#   - job A `preflight` is read-only and runs BEFORE approval: it validates
#     the input, downloads the target release manifest through the engine
#     (GitHub Releases asset, never by hand), and runs the engine preflight
#     (target exists and is a published official release, non-current, in
#     the advertised rollback window, complete and retained via the chunk-6C
#     audit checks, compatible fingerprint, internally consistent live
#     state/snapshot, OP-DB-02 schema-change guard) and prints the approval
#     summary.
#   - job B `rollback` sits behind the protected `production` Environment
#     (owner-only required reviewer), shares the queued non-canceling
#     `production` concurrency group, and runs `rollback execute`, which
#     repeats the FULL preflight after approval/lock acquisition against a
#     FRESH snapshot and requires the approval identity to match job A's
#     byte for byte (post-approval drift aborts before mutation). The
#     execute command deploys the COMPLETE target set (backends -> gateway
#     -> frontend from the retained immutable prefix), verifies read-only
#     against the release manifest, and records a SEPARATE rollback result
#     (CT-REL-02: official history is never edited). `approvedBy` is derived
#     from the environment-approval evidence (actions/runs/{run}/approvals),
#     never github.actor.
#
# OP-CUT-01 bring-up guard: while the legacy promote-release.yml OR
# rollback-release.yml still declares its production-mutating path, both jobs
# refuse with exit 1 BEFORE any AWS credentials are used, so the legacy and
# greenfield paths can never mutate production concurrently. The legacy
# rollback workflow holds the `production-mutation` concurrency group, which
# does NOT serialize with this workflow's `production` group — hence both
# legacy files are refused. REMOVE THE GUARD STEPS AT CUTOVER together with
# the legacy workflows. (A "disabled" workflow state is not locally
# observable; the guard is fail-closed: remove or empty the legacy files to
# proceed.)
#
# Failure honesty (AD-13 / OP-REC-04): on a post-mutation failure the
# rollback job fails, preserving the pre-mutation snapshot, the preflight
# report, the release manifest, the approval evidence, and the failed
# rollback result as artifacts (retention 14 days). The `compensate` job
# restores exactly the fully-completed components (per-component conclusions
# in the rollback result; only `passed` is ever compensated — a `failed`
# component is ambiguous and waits for manual diagnosis) from the
# pre-mutation snapshot via the recover engine. The database is never
# mutated and never reversed by this system (OP-DB-02).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Official release id to roll back to (release-NNNN)'
        required: true

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  # AD-17 job-scoped role boundaries: the unapproved read-only `preflight`
  # job must never hold the full production Deployer role, and the mutation
  # job must never hold the read-only one.
  # - AWS_ROLE_ARN_PRODUCTION: the full production Deployer role. Assumed
  #   ONLY by the `rollback` and `compensate` jobs (production mutation,
  #   behind the protected `production` Environment for the approved job).
  # - PRODUCTION_PREFLIGHT_ROLE_ARN: the read-only preflight role, assumed
  #   ONLY by the unapproved `preflight` job (read-only: ecs describe*, ecr
  #   batch-get-image/describe*, s3 get-object on the frontend bucket, rds
  #   describe*, elb describe*, cloudfront get*; ZERO mutation actions).
  AWS_ROLE_ARN_PRODUCTION: arn:aws:iam::799111666795:role/github-actions-production
  PRODUCTION_PREFLIGHT_ROLE_ARN: arn:aws:iam::799111666795:role/github-actions-production-preflight

jobs:
  preflight:
    runs-on: ubuntu-latest
    # Read-only pre-approval job: does NOT hold the production concurrency
    # group (D5) and has no protected environment. id-token: write is used
    # only for the read-only AWS scope (snapshot + ECR/S3 revalidation).
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # OP-CUT-01 / AD-18 bring-up guard (REMOVE AT CUTOVER): refuse before
      # any AWS credentials while either legacy production-mutation workflow
      # still exists. Marker choice: each legacy workflow's mutation entry
      # point — promote-release.yml invokes finalize-release.sh and
      # rollback-release.yml invokes deploy-rollback.sh. The legacy
      # `production-mutation` concurrency group does NOT serialize with the
      # greenfield `production` group, so both are refused.
      - name: 'Bring-up guard: refuse while a legacy production-mutation path is active'
        run: |
          set -euo pipefail
          LEGACY_PROMOTE_WORKFLOW=".github/workflows/promote-release.yml"
          LEGACY_ROLLBACK_WORKFLOW=".github/workflows/rollback-release.yml"
          if [ -f "$LEGACY_PROMOTE_WORKFLOW" ] && grep -q -F -- 'finalize-release.sh' "$LEGACY_PROMOTE_WORKFLOW"; then
            echo "ERROR: the legacy promote-release.yml production-mutation path is still present" >&2
            echo "Old and new must never mutate production concurrently (OP-CUT-01)." >&2
            echo "No AWS credentials were used; nothing was mutated." >&2
            exit 1
          fi
          if [ -f "$LEGACY_ROLLBACK_WORKFLOW" ] && grep -q -F -- 'deploy-rollback.sh' "$LEGACY_ROLLBACK_WORKFLOW"; then
            echo "ERROR: the legacy rollback-release.yml production-mutation path is still present" >&2
            echo "Its production-mutation concurrency group does not serialize with the greenfield production group (OP-CUT-01)." >&2
            echo "No AWS credentials were used; nothing was mutated." >&2
            exit 1
          fi
          echo "legacy production-mutation paths inactive; preflight proceeds"

      # Untrusted workflow_dispatch inputs travel through step env and are
      # regex-validated before any use; they are never interpolated raw.
      - name: Validate dispatch inputs
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^release-[0-9]{4}$ ]] || { echo "ERROR: version must be an official release id (release-NNNN)" >&2; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install delivery package
        run: python -m pip install --disable-pip-version-check -q ./delivery

      # AD-17: the unapproved preflight is read-only and must never hold the
      # full production Deployer role. It assumes the dedicated read-only
      # preflight role (see the PRODUCTION_PREFLIGHT_ROLE_ARN env comment for
      # the exact policy scope; zero mutation actions). The rollback and
      # compensate jobs are the only consumers of AWS_ROLE_ARN_PRODUCTION.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.PRODUCTION_PREFLIGHT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Capture the read-only production snapshot
        run: |
          set -euo pipefail
          python -m delivery.cli snapshot production \
            --environment production \
            --identifiers scripts/config/production-identifiers.json \
            --out production-snapshot.json

      # The target release manifest is downloaded by the ENGINE from the
      # official GitHub Release asset (release-manifest.json), never by hand
      # (D2). --schema-change absent reflects OP-DB-02: rollback never
      # reverses database schema or data.
      - name: Run the read-only rollback preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python -m delivery.cli rollback preflight \
            --release-id "$VERSION" \
            --snapshot production-snapshot.json \
            --schema-change absent \
            --migration-reviewed false \
            --repository "$REPOSITORY" \
            --environment production \
            --identifiers scripts/config/production-identifiers.json \
            --out preflight-report.json \
            --manifest-out release-manifest.json

      - name: Print the approval summary
        run: jq -r '.approvalSummary' preflight-report.json

      - name: Upload preflight report, snapshot, and release manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preflight-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            preflight-report.json
            production-snapshot.json
            release-manifest.json
          if-no-files-found: warn
          retention-days: 14

  rollback:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # AD-10 / OP-GEN-01: one queued, non-canceling production mutation group.
    # The preflight job does NOT hold it; only this job mutates production.
    concurrency:
      group: production
      cancel-in-progress: false
    # AD-10: the protected `production` Environment requires owner approval.
    environment:
      name: production
    # AD-13: the derive-changed step publishes how many rollback components
    # fully completed (from the honest per-component conclusions in the
    # rollback result, never guessed), so the compensate job runs only after
    # a defined post-mutation failure.
    outputs:
      changed-count: ${{ steps.derive-changed.outputs.changed-count }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # OP-CUT-01 / AD-18 bring-up guard (REMOVE AT CUTOVER): same refusal as
      # the preflight job, re-checked under the lock.
      - name: 'Bring-up guard: refuse while a legacy production-mutation path is active'
        run: |
          set -euo pipefail
          LEGACY_PROMOTE_WORKFLOW=".github/workflows/promote-release.yml"
          LEGACY_ROLLBACK_WORKFLOW=".github/workflows/rollback-release.yml"
          if [ -f "$LEGACY_PROMOTE_WORKFLOW" ] && grep -q -F -- 'finalize-release.sh' "$LEGACY_PROMOTE_WORKFLOW"; then
            echo "ERROR: the legacy promote-release.yml production-mutation path is still present" >&2
            echo "Old and new must never mutate production concurrently (OP-CUT-01)." >&2
            echo "No AWS credentials were used; nothing was mutated." >&2
            exit 1
          fi
          if [ -f "$LEGACY_ROLLBACK_WORKFLOW" ] && grep -q -F -- 'deploy-rollback.sh' "$LEGACY_ROLLBACK_WORKFLOW"; then
            echo "ERROR: the legacy rollback-release.yml production-mutation path is still present" >&2
            echo "Its production-mutation concurrency group does not serialize with the greenfield production group (OP-CUT-01)." >&2
            echo "No AWS credentials were used; nothing was mutated." >&2
            exit 1
          fi
          echo "legacy production-mutation paths inactive; rollback proceeds"

      # Same validation convention as the other jobs: workflow_dispatch inputs
      # are untrusted and validated before any use.
      - name: Validate dispatch inputs
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^release-[0-9]{4}$ ]] || { echo "ERROR: version must be an official release id (release-NNNN)" >&2; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install delivery package
        run: python -m pip install --disable-pip-version-check -q ./delivery

      - name: Download the pre-approval preflight report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preflight-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: preflight
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      # AD-17: the approved mutation job is the only consumer of the full
      # production Deployer role (AWS_ROLE_ARN_PRODUCTION); it never uses
      # the read-only preflight role.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN_PRODUCTION }}
          aws-region: ${{ env.AWS_REGION }}

      # OP-REC-04: fresh snapshot under the lock; rollback execute repeats
      # the FULL preflight against it and any drift aborts before mutation.
      - name: Capture the pre-mutation production snapshot
        run: |
          set -euo pipefail
          python -m delivery.cli snapshot production \
            --environment production \
            --identifiers scripts/config/production-identifiers.json \
            --out production-snapshot.json

      # AD-13: publish the pre-mutation snapshot IMMEDIATELY after capture so
      # the compensate job can always download it — even when a later step
      # fails hard and the end-of-job evidence upload never runs.
      - name: Upload the pre-mutation snapshot for automatic compensation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rollback-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: production-snapshot.json
          if-no-files-found: warn
          retention-days: 14

      # approvedBy AND approvedAt are derived from the environment-approval
      # evidence (actions/runs/{run}/approvals), never from github.actor or
      # user input, and approvedAt is never the runner clock (AD-10 /
      # CT-AUDIT-01). The matching approved production review carries the
      # approval timestamp as approved_at (falling back to created_at when
      # approved_at is absent from the API answer); both logins and the
      # timestamp are strictly validated before the JSON is written, and the
      # step fails closed when the API answer carries no non-empty ISO-8601
      # timestamp. `date` is never called here.
      - name: Resolve the environment approver and approval timestamp
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ACTOR" =~ ^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?$ ]] || { echo "ERROR: invalid actor login" >&2; exit 1; }
          APPROVAL_EVENT=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/approvals" \
            --jq '[.[] | select(.state == "approved") | select((.environments // []) | any(.name == "production"))] | if length == 0 then error("no approved production environment review") else .[0] end')
          APPROVED_BY=$(printf '%s' "$APPROVAL_EVENT" | jq -r '.user.login // empty')
          [[ "$APPROVED_BY" =~ ^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?$ ]] || { echo "ERROR: invalid approver login" >&2; exit 1; }
          APPROVED_AT=$(printf '%s' "$APPROVAL_EVENT" | jq -r '.approved_at // .created_at // empty')
          [[ "$APPROVED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || {
            echo "ERROR: the approved production review carries no valid ISO-8601 approval timestamp" >&2
            exit 1
          }
          jq -n \
            --arg approver "$APPROVED_BY" \
            --arg requester "$RUN_ACTOR" \
            --arg workflowUrl "https://github.com/$REPOSITORY/actions/runs/$RUN_ID" \
            --arg approvedAt "$APPROVED_AT" \
            '{schemaVersion: "1.0", approver: $approver, requester: $requester, workflowUrl: $workflowUrl, approvedAt: $approvedAt}' \
            > approval-evidence.json
          jq -e '.approver != "" and .requester != "" and .approvedAt != ""' approval-evidence.json >/dev/null

      # OP-REC-04: re-run the FULL preflight (execute does it internally
      # against the fresh snapshot, with the byte-for-byte approval-identity
      # match), deploy the COMPLETE target set from the release manifest's
      # exact digests (backends -> gateway -> frontend from the retained
      # immutable prefix), verify read-only against the release manifest,
      # and record a SEPARATE rollback result. No official release is
      # created, no manifest is edited, no ECR tag is minted/moved, and the
      # database is never touched (OP-DB-02).
      - name: Execute the approved rollback
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python -m delivery.cli rollback execute \
            --manifest preflight/release-manifest.json \
            --snapshot production-snapshot.json \
            --preflight-report preflight/preflight-report.json \
            --approval approval-evidence.json \
            --workflow-run-id "$RUN_ID" \
            --workflow-run-attempt "$RUN_ATTEMPT" \
            --repository "$REPOSITORY" \
            --environment production \
            --identifiers scripts/config/production-identifiers.json \
            --out rollback-result.json

      # AD-13: derive the changed components ONLY from the honest per-component
      # conclusions in the rollback result (fully `passed` components are
      # compensated; `failed` is ambiguous and `not-attempted` untouched).
      - name: Derive changed components from the rollback result
        id: derive-changed
        if: always()
        run: |
          set -euo pipefail
          if [ -f rollback-result.json ]; then
            jq -c '[.components[] | select(.conclusion == "passed") | .component]' rollback-result.json > changed.json
          else
            echo '[]' > changed.json
          fi
          CHANGED_COUNT=$(jq -r 'length' changed.json)
          echo "changed-count=$CHANGED_COUNT" >> "$GITHUB_OUTPUT"
          echo "changed components: $(cat changed.json)"

      # AD-13 / OP-REC-02: record the ORIGINAL failure separately from the
      # compensation outcome. github.actor is not consulted.
      - name: Record the rollback failure context
        if: failure()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          jq -n \
            --arg workflowRunId "$RUN_ID" \
            --arg workflowRunAttempt "$RUN_ATTEMPT" \
            --arg workflowUrl "https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
            '{schemaVersion: "1.0", workflowRunId: ($workflowRunId | tonumber), workflowRunAttempt: ($workflowRunAttempt | tonumber), workflowUrl: $workflowUrl, conclusion: "failed"}' \
            > rollback-failure-context.json

      # D7 failure honesty: on any failure the pre-mutation snapshot and every
      # evidence file are preserved (>= 14 days) for compensation.
      - name: Upload rollback evidence (snapshot + reports)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rollback-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            production-snapshot.json
            preflight/preflight-report.json
            preflight/release-manifest.json
            approval-evidence.json
            rollback-result.json
            rollback-result-verification.json
            changed.json
            rollback-failure-context.json
          if-no-files-found: warn
          retention-days: 14

      - name: Print rollback conclusions
        if: always()
        run: |
          set -euo pipefail
          if [ -f rollback-result.json ]; then
            jq -e '{releaseId: .releaseId, fromReleaseId: .fromReleaseId, outcome: .outcome, requester: .requester, approver: .approver, components: [.components[] | {component, conclusion}]}' rollback-result.json
          else
            echo "rollback result was not written; evidence artifacts above are preserved for compensation"
          fi

  # ---------------------------------------------------------------------------
  # Phase 6 automatic compensation (AD-13 / OP-REC-02).
  #
  # Runs only when the rollback job FAILED and at least one component fully
  # completed (`changed-count` derives from the rollback result's per-component
  # conclusions, which mark only fully-deployed-and-verified components as
  # `passed` — never guessed). A rollback that failed before any mutation
  # (preflight, snapshot, drift, bring-up guard) derives zero changed
  # components, so this job is skipped and the evidence waits for manual
  # diagnosis. A component that failed part-way is ambiguous: it is NOT
  # compensated and its evidence is preserved (documented limitation).
  #
  # Per AD-13 this job requires NO protected-Environment approval: it can
  # only move production BACK toward the pre-mutation snapshot the owner
  # already approved rolling away from, using inputs recorded by the
  # rollback job itself. It still holds the queued non-canceling production
  # concurrency group so compensation can never race promotion or rollback.
  # ---------------------------------------------------------------------------
  compensate:
    needs: rollback
    if: failure() && needs.rollback.outputs.changed-count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # OP-CUT-01 / AD-18 bring-up guard (REMOVE AT CUTOVER): identical to the
      # other jobs. Compensation only ever runs after the rollback job
      # mutated, which already proves the legacy paths were inactive; the
      # re-check is defense in depth under the lock.
      - name: 'Bring-up guard: refuse while a legacy production-mutation path is active'
        run: |
          set -euo pipefail
          LEGACY_PROMOTE_WORKFLOW=".github/workflows/promote-release.yml"
          LEGACY_ROLLBACK_WORKFLOW=".github/workflows/rollback-release.yml"
          if [ -f "$LEGACY_PROMOTE_WORKFLOW" ] && grep -q -F -- 'finalize-release.sh' "$LEGACY_PROMOTE_WORKFLOW"; then
            echo "ERROR: the legacy promote-release.yml production-mutation path is still present" >&2
            echo "Old and new must never mutate production concurrently (OP-CUT-01)." >&2
            echo "No AWS credentials were used; nothing was mutated." >&2
            exit 1
          fi
          if [ -f "$LEGACY_ROLLBACK_WORKFLOW" ] && grep -q -F -- 'deploy-rollback.sh' "$LEGACY_ROLLBACK_WORKFLOW"; then
            echo "ERROR: the legacy rollback-release.yml production-mutation path is still present" >&2
            echo "Its production-mutation concurrency group does not serialize with the greenfield production group (OP-CUT-01)." >&2
            echo "No AWS credentials were used; nothing was mutated." >&2
            exit 1
          fi
          echo "legacy production-mutation paths inactive; compensation proceeds"

      # Same validation convention as the other jobs: workflow_dispatch inputs
      # are untrusted and validated before any use.
      - name: Validate dispatch inputs
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^release-[0-9]{4}$ ]] || { echo "ERROR: version must be an official release id (release-NNNN)" >&2; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install delivery package
        run: python -m pip install --disable-pip-version-check -q ./delivery

      # The snapshot artifact is uploaded by the rollback job right after
      # capture, before any mutation, so it exists even for hard failures.
      - name: Download the pre-mutation snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rollback-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: rollback-snapshot
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      # Optional evidence bundle: carries the rollback result and the
      # original-failure context. A genuinely absent bundle (job killed
      # before the upload) is tolerated here and reported honestly.
      - name: Download the rollback evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rollback-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: rollback-evidence
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          if-no-files-found: warn

      # AD-17: compensation is a declared production mutation and uses the
      # full production Deployer role, never the read-only preflight role.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN_PRODUCTION }}
          aws-region: ${{ env.AWS_REGION }}

      # Build --changed ONLY from the rollback result's fully-completed
      # components (their per-component conclusions), through jq (never shell
      # string concatenation). Conclusions are compared against the literal
      # "passed"; a fully-empty array fails closed.
      - name: Build the changed component array from the rollback result
        run: |
          set -euo pipefail
          jq -c '[.components[] | select(.conclusion == "passed") | .component]' rollback-evidence/rollback-result.json > changed.json
          jq -e 'length > 0' changed.json >/dev/null || {
            echo "ERROR: no fully completed rollback component; automatic compensation must not run" >&2
            exit 1
          }
          echo "changed components: $(cat changed.json)"

      # OP-REC-02: stop forward progress (already stopped — the rollback job
      # failed), restore the changed components from the snapshot, and record
      # both outcomes. The recovery result carries the original failure
      # separately from the recovery outcome; a recovery failure fails this
      # job and is never reported as success.
      - name: Restore the pre-mutation snapshot (automatic compensation)
        env:
          ORIGINAL_RESULT: ${{ needs.rollback.result }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ORIGINAL_FAILURE="rollback job result: $ORIGINAL_RESULT"
          if [ -f rollback-evidence/rollback-failure-context.json ]; then
            jq -e '.conclusion == "failed"' rollback-evidence/rollback-failure-context.json >/dev/null
            ORIGINAL_FAILURE="rollback failed (run $(jq -r '.workflowRunId' rollback-evidence/rollback-failure-context.json), attempt $(jq -r '.workflowRunAttempt' rollback-evidence/rollback-failure-context.json))"
          fi
          python -m delivery.cli recover \
            --snapshot rollback-snapshot/production-snapshot.json \
            --changed changed.json \
            --out recovery-result.json \
            --original-failure "$ORIGINAL_FAILURE" \
            --environment production \
            --identifiers scripts/config/production-identifiers.json

      # OP-REC-02 repeats OP-DEP-04: after recovery the restored production
      # state is re-verified read-only against the SAME pre-mutation snapshot
      # recover consumed (running digests, live marker + checksum,
      # CloudFront-visible identity, read-only journeys). A verification
      # failure fails this job and is reported in the outcome report below.
      - name: Verify the restored production state read-only
        run: |
          set -euo pipefail
          python -m delivery.cli verify production \
            --snapshot rollback-snapshot/production-snapshot.json \
            --environment production \
            --identifiers scripts/config/production-identifiers.json \
            --out recovery-verification.json

      - name: Upload the recovery result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recovery-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery-result.json
            recovery-verification.json
          if-no-files-found: warn
          retention-days: 14

      # OP-REC-01: report BOTH the original failure and the recovery outcome;
      # the job fails when recovery failed or when the post-recovery
      # read-only verification did not confirm the restored state, and never
      # claims success for a failed recovery.
      - name: Report the original failure and the recovery outcome
        if: always()
        env:
          ORIGINAL_RESULT: ${{ needs.rollback.result }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "ORIGINAL FAILURE: rollback job result was $ORIGINAL_RESULT (run $RUN_ID)"
          if [ ! -f recovery-result.json ]; then
            echo "ERROR: automatic compensation produced no result; the original failure is UNRESOLVED" >&2
            exit 1
          fi
          jq '{outcome, snapshotId, originalFailure, components: [.components[] | {component, conclusion}]}' recovery-result.json
          OUTCOME=$(jq -r '.outcome' recovery-result.json)
          if [ "$OUTCOME" = "failed" ]; then
            echo "ERROR: automatic compensation FAILED ($(jq -r '.failureDetail // "no detail"' recovery-result.json)); the original failure is UNRESOLVED" >&2
            exit 1
          fi
          if [ ! -f recovery-verification.json ]; then
            echo "ERROR: post-recovery verification produced no report; the restored state is NOT confirmed" >&2
            exit 1
          fi
          VERIFICATION=$(jq -r '.conclusion' recovery-verification.json)
          echo "VERIFICATION OUTCOME: $VERIFICATION (read-only production verification against the restored snapshot)"
          if [ "$VERIFICATION" != "passed" ]; then
            echo "ERROR: post-recovery verification FAILED; the restored production state is NOT confirmed" >&2
            exit 1
          fi
          echo "RECOVERY OUTCOME: completed - the pre-mutation snapshot was restored"
