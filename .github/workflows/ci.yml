name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  record-candidate:
    name: Candidate identity
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Record checked-out merge candidate without executing candidate code
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          pr = event['pull_request']
          def revision(ref):
              return subprocess.check_output(['git', 'rev-parse', ref], text=True).strip()
          candidate = revision('HEAD')
          head, base = revision('HEAD^2'), revision('HEAD^1')
          if (candidate != os.environ['CANDIDATE_SHA']
                  or head != pr['head']['sha'] or base != pr['base']['sha']):
              raise SystemExit('Checkout does not match triggering PR merge candidate')
          record = {
              'repository': os.environ['GITHUB_REPOSITORY'], 'pr': event['number'],
              'head_sha': head, 'base_sha': base, 'candidate_sha': candidate,
              'ci_run_id': int(os.environ['GITHUB_RUN_ID']),
              'ci_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'event': os.environ['GITHUB_EVENT_NAME'],
          }
          directory = Path(os.environ['RUNNER_TEMP']) / 'ci-candidate'
          directory.mkdir(mode=0o700)
          (directory / 'candidate.json').write_text(json.dumps(record))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-candidate/candidate.json
          if-no-files-found: error
          retention-days: 14

  verify-auth:
    name: Java (Auth)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Temurin Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            Auth/pom.xml
            Auth/.mvn/wrapper/maven-wrapper.properties

      - name: Verify Auth
        working-directory: Auth
        run: ./mvnw --batch-mode clean verify

      - name: Upload Auth test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-test-reports-auth
          path: |
            Auth/target/surefire-reports/
            Auth/target/failsafe-reports/
          if-no-files-found: ignore

  verify-api-gateway:
    name: Java (API Gateway)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Temurin Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            api-gateway/pom.xml
            api-gateway/.mvn/wrapper/maven-wrapper.properties

      - name: Verify API Gateway
        working-directory: api-gateway
        run: ./mvnw --batch-mode clean verify

      - name: Upload API Gateway test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-test-reports-api-gateway
          path: |
            api-gateway/target/surefire-reports/
            api-gateway/target/failsafe-reports/
          if-no-files-found: ignore

  verify-items:
    name: Java (common -> Items)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Temurin Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            common/pom.xml
            common/.mvn/wrapper/maven-wrapper.properties
            Items/pom.xml
            Items/.mvn/wrapper/maven-wrapper.properties

      - name: Install common library
        working-directory: common
        run: ./mvnw --batch-mode clean install

      - name: Verify Items
        working-directory: Items
        run: ./mvnw --batch-mode clean verify

      - name: Upload Items test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-test-reports-common-items
          path: |
            common/target/surefire-reports/
            common/target/failsafe-reports/
            Items/target/surefire-reports/
            Items/target/failsafe-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  images-and-pr-e2e:
    name: Images and PR E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build application images
        run: docker compose build auth-service items-service api-gateway frontend

      - name: Set up Temurin Java 25 for E2E
        if: github.event_name == 'pull_request'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Start complete stack
        if: github.event_name == 'pull_request'
        run: docker compose up -d --no-build --wait --wait-timeout 300

      - name: Verify gateway and frontend readiness
        if: github.event_name == 'pull_request'
        run: |
          deadline=$((SECONDS + 120))
          until curl --fail --silent --show-error http://localhost:10000/actuator/health; do
            if (( SECONDS >= deadline )); then
              echo "Gateway did not become ready within 120 seconds."
              exit 1
            fi
            sleep 5
          done

          deadline=$((SECONDS + 120))
          until curl --fail --silent --show-error http://localhost:5173/; do
            if (( SECONDS >= deadline )); then
              echo "Frontend did not become ready within 120 seconds."
              exit 1
            fi
            sleep 5
          done

      - name: Run API E2E tests
        if: github.event_name == 'pull_request'
        working-directory: e2e-tests
        env:
          E2E_BASE_URL: http://localhost:10000
        run: ./mvnw --batch-mode clean test

      - name: Upload PR E2E test reports
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-e2e-test-reports
          path: e2e-tests/target/surefire-reports/
          if-no-files-found: ignore

      - name: Show PR Compose status
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: |
          set -o pipefail
          docker compose ps -a --format 'table {{.Name}}\t{{.State}}\t{{.Status}}' | sed -n '1,20p'

      - name: Show failing application logs
        if: ${{ failure() && github.event_name == 'pull_request' }}
        run: |
          set -o pipefail
          docker compose logs --no-color --tail=100 auth-service items-service api-gateway frontend | sed -E \
            -e '/(password|token|secret|authorization)/I s/.*/[REDACTED sensitive log line]/' \
            -e 's#(//[^/:[:space:]]+):[^@[:space:]]+@#\1:[REDACTED]@#g'

      - name: Tear down PR Compose stack
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: docker compose down -v --remove-orphans
