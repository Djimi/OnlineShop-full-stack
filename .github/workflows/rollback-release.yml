name: Rollback Release

# Manual owner-approved rollback of production to an existing immutable official
# release (Pass 3, subphase 3.6). The input is the `version` of an existing
# official `v<version>` release (never an arbitrary tag, digest, or SHA). The
# exact historical ECR digests and the retained immutable frontend prefix of
# that release are re-deployed — nothing is rebuilt, no ECR tag is minted or
# moved (the rollback IAM policy has no `ecr:PutImage`), and no new official
# release is created.
#
# Control plane:
#   - The production mutation job is behind the protected `production`
#     Environment (owner-only required reviewer) and the shared non-cancelling
#     `production-mutation` concurrency group shared with promotion (Decision 10).
#   - A read-only `preflight` job runs BEFORE approval. It validates the target
#     version, resolves it from the latest 10 complete official release sets
#     (confirming the exact ECR `release-*` digests and the frontend prefix
#     marker still exist), enforces the database-compatibility guard (Decision
#     8), and emits the validated target manifest as an artifact. It never
#     mutates anything.
#   - After approval + lock acquisition the `rollback` job re-runs the FULL
#     preflight against a fresh observed snapshot (time-of-check race closure),
#     snapshots the pre-rollback state for compensation, deploys the target
#     digests, restores the frontend from the retained immutable prefix, and
#     verifies production before recording the rollback result.
#   - `approvedBy` is derived from the GitHub deployment/environment approval
#     evidence (`actions/runs/{run}/approvals`), never from `github.actor` or
#     user input; `requester` is the operator who dispatched the rollback.
#   - On failure the `compensate` job restores the changed components to the
#     exact pre-rollback snapshot (Decision 13). The database is never reversed.
#
# No workflow is executed during substep 3.6 implementation; this file is
# static-checked by tests/scripts/rollback_test.sh and its live runs are
# deferred to the consolidated verification pass.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing official release SemVer to roll back to (MAJOR.MINOR.PATCH, no leading v)'
        required: true
        type: string
      requester:
        description: 'Operator requesting the rollback (GitHub login)'
        required: false
        type: string
      schema_change:
        description: 'Does rolling back to this release involve a database/schema change?'
        required: false
        type: boolean
        default: false
      migration_reviewed:
        description: 'Decision 8: has a forward/backward-compatible migration + recovery procedure been reviewed?'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: write
  actions: read
  deployments: write

concurrency:
  # One production mutation at a time; superseding/cancelling an in-progress
  # rollback is an explicit operator action, never automatic (Decision 10).
  # Shared with promotion.
  group: production-mutation
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  RELEASE: plans/AUTOMATIC-BUILDS-AND-DEPLOY/release
  GITHUB_REPOSITORY: ${{ github.repository }}

jobs:
  # Read-only preflight BEFORE any approval. Validates the target version,
  # resolves it from the latest complete official release sets (confirming the
  # exact ECR digests and frontend prefix still exist), enforces the schema
  # compatibility guard, and emits the validated target manifest. It uses the
  # rollback role's read-only scope (ECR/S3 reads only; no mutation) and runs
  # rollback-preflight.sh, which never mutates anything.
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      requester: ${{ steps.inputs.outputs.requester }}
    steps:
      # actions/checkout@v4 (11d5960a326750d5838078e36cf38b85af677262)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate dispatch inputs (target version + requester)
        id: inputs
        run: |
          source "${{ env.RELEASE }}/bin/release-input.sh"
          rl_assert_semver "${{ github.event.inputs.version }}" || exit 1
          REQUESTER="${{ github.event.inputs.requester }}"
          if [ -z "$REQUESTER" ]; then
            REQUESTER="${{ github.actor }}"
          fi
          rl_assert_github_login "$REQUESTER" || exit 1
          echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          echo "requester=$REQUESTER" >> "$GITHUB_OUTPUT"

      # aws-actions/configure-aws-credentials@v4 (ff717079ee2060e4bcee96c4779b553acc87447c)
      # The preflight is read-only; the rollback role grants exactly the reads it
      # needs (ECR describe-images, S3 get-object, STS identity). The per-purpose
      # role split is applied in the consolidated verification pass.
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: arn:aws:iam::799111666795:role/github-actions-onlineshop
          aws-region: ${{ env.AWS_REGION }}

      # actions/setup-python@v5 (0b93645e9fea731e1acf3a5843feb99726597842)
      - uses: actions/setup-python@0b93645e9fea731e1acf3a5843feb99726597842
        with:
          python-version: '3.12'

      - name: Configure mandatory AWS CLI profile
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile dpm-profile
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile dpm-profile
          aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile dpm-profile
          aws sts get-caller-identity --profile dpm-profile --region eu-north-1

      - name: Install release contract dependencies
        run: pip install -q -r "${{ env.RELEASE }}/requirements.txt"

      - name: Run read-only rollback preflight (before approval)
        id: preflight
        run: |
          bash "${{ env.RELEASE }}/bin/rollback-preflight.sh" \
            --version "${{ steps.inputs.outputs.version }}" \
            --schema-change "${{ github.event.inputs.schema_change == true && 'present' || 'absent' }}" \
            --migration-reviewed "${{ github.event.inputs.migration_reviewed == true && 'true' || 'false' }}" \
            --target-manifest rollback-target-manifest.json \
            --profile dpm-profile --region ${{ env.AWS_REGION }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ env.GITHUB_REPOSITORY }}

      - name: Upload the validated rollback target manifest
        # actions/upload-artifact@v4 (ea165f8d65b6e75b540449e92b4886f43607fa02)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rollback-target-manifest
          path: rollback-target-manifest.json
          retention-days: 14

  # The approved production mutation job. It requires the owner-only protected
  # `production` Environment approval (Decision 5). On approval it re-runs the
  # full preflight with a fresh snapshot before any mutation (time-of-check
  # race closure).
  rollback:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: production
    steps:
      # actions/checkout@v4 (11d5960a326750d5838078e36cf38b85af677262)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # aws-actions/configure-aws-credentials@v4 (ff717079ee2060e4bcee96c4779b553acc87447c)
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: arn:aws:iam::799111666795:role/github-actions-onlineshop
          aws-region: ${{ env.AWS_REGION }}

      # actions/setup-python@v5 (0b93645e9fea731e1acf3a5843feb99726597842)
      - uses: actions/setup-python@0b93645e9fea731e1acf3a5843feb99726597842
        with:
          python-version: '3.12'

      - name: Configure mandatory AWS CLI profile
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile dpm-profile
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile dpm-profile
          aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile dpm-profile
          aws sts get-caller-identity --profile dpm-profile --region eu-north-1

      - name: Install release contract dependencies
        run: pip install -q -r "${{ env.RELEASE }}/requirements.txt"

      - name: Download the validated rollback target manifest
        # actions/download-artifact@v4 (fa0a91b85d4f404e444e00e005971372dc801d16)
        # The target manifest was validated by the pre-approval preflight from
        # this exact run; the mutation job consumes those same bytes.
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: rollback-target-manifest
          path: target
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Run the full rollback preflight after approval and lock acquisition
        id: preflight2
        run: |
          set -euo pipefail
          [ -f target/rollback-target-manifest.json ] || {
            echo "ERROR: rollback target manifest is unavailable" >&2
            exit 1
          }
          # Re-run the read-only preflight with a FRESH observed snapshot so the
          # release is still selectable (complete, in-window, not current) at the
          # moment of mutation; only this run authorizes mutation.
          bash "${{ env.RELEASE }}/bin/rollback-preflight.sh" \
            --version "${{ github.event.inputs.version }}" \
            --schema-change "${{ github.event.inputs.schema_change == true && 'present' || 'absent' }}" \
            --migration-reviewed "${{ github.event.inputs.migration_reviewed == true && 'true' || 'false' }}" \
            --target-manifest rollback-target-manifest.json \
            --profile dpm-profile --region ${{ env.AWS_REGION }}
          cp target/rollback-target-manifest.json rollback-target-manifest.json
          jq -e --arg v "${{ github.event.inputs.version }}" '.release.version == $v' \
            rollback-target-manifest.json >/dev/null
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ env.GITHUB_REPOSITORY }}

      - name: Snapshot pre-rollback production state
        id: snapshot
        run: |
          bash "${{ env.RELEASE }}/bin/snapshot-production.sh" \
            --manifest rollback-target-manifest.json \
            --profile dpm-profile --region ${{ env.AWS_REGION }} \
            > production-snapshot.json
          echo "snapshot written"
        env:
          GITHUB_REPOSITORY: ${{ env.GITHUB_REPOSITORY }}

      - name: Upload pre-rollback snapshot (compensation source)
        # actions/upload-artifact@v4 (ea165f8d65b6e75b540449e92b4886f43607fa02)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-snapshot
          path: production-snapshot.json
          retention-days: 14

      - name: Register digest-pinned task definitions and deploy
        id: deploy
        run: |
          set -euo pipefail
          # deploy-rollback.sh emits the deployment manifest (the target bytes +
          # the newly registered task-definition ARNs) on stdout.
          bash "${{ env.RELEASE }}/bin/deploy-rollback.sh" \
            --manifest rollback-target-manifest.json \
            --snapshot production-snapshot.json \
            --ecr-registry 799111666795.dkr.ecr.eu-north-1.amazonaws.com \
            --profile dpm-profile --region ${{ env.AWS_REGION }} \
            > deployment-manifest.json
          jq -e '.components.auth.taskDefinitionArn and .components.items.taskDefinitionArn and .components.apiGateway.taskDefinitionArn' \
            deployment-manifest.json >/dev/null
          echo "deployment-manifest written"

      - name: Restore frontend from the retained immutable prefix
        id: frontend
        run: |
          bash "${{ env.RELEASE }}/bin/restore-frontend.sh" \
            --manifest rollback-target-manifest.json \
            --bucket onlineshop-frontend-799111666795 \
            --distribution EPS8MI3FV3B7X \
            --profile dpm-profile --region ${{ env.AWS_REGION }}

      - name: Verify production after rollback
        id: verify
        run: |
          bash "${{ env.RELEASE }}/bin/verify-rollback.sh" \
            --manifest deployment-manifest.json \
            --profile dpm-profile --region ${{ env.AWS_REGION }}

      - name: Record the rollback result / audit annotation
        id: result
        run: |
          set -euo pipefail
          # `approvedBy` is derived from the GitHub environment-approval evidence
          # for this run (`actions/runs/{run}/approvals`), never from github.actor
          # or user input (Decision 5). It fails closed if the approved
          # `production` review cannot be resolved.
          APPROVED_BY=$(gh api "repos/${{ env.GITHUB_REPOSITORY }}/actions/runs/${{ github.run_id }}/approvals" \
            --jq '[.[] | select(.state == "approved") | select((.environments // []) | any(.name == "production")) | .user.login] | if length == 0 then error("no approved production environment review") else .[0] end')
          [[ "$APPROVED_BY" =~ ^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?$ ]] || {
            echo "ERROR: invalid approver login" >&2
            exit 1
          }
          bash "${{ env.RELEASE }}/bin/record-rollback-result.sh" \
            --manifest deployment-manifest.json \
            --snapshot production-snapshot.json \
            --run-id "${{ github.run_id }}" \
            --workflow-url "${{ github.server_url }}/${{ env.GITHUB_REPOSITORY }}/actions/runs/${{ github.run_id }}" \
            --requester "${{ needs.preflight.outputs.requester }}" \
            --approver "$APPROVED_BY" \
            --outcome success \
            --profile dpm-profile --region ${{ env.AWS_REGION }} \
            > rollback-result.json
          echo "rollback result recorded"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ env.GITHUB_REPOSITORY }}

      - name: Upload the rollback result (audit annotation)
        # actions/upload-artifact@v4 (ea165f8d65b6e75b540449e92b4886f43607fa02)
        # The rollback result annotates the deployment/audit record without
        # editing the immutable original release manifest.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rollback-result
          path: rollback-result.json
          retention-days: 14

  # On a failure of the rollback job, compensate the changed components to the
  # exact pre-rollback snapshot in reverse order. This job depends on rollback
  # and reads the snapshot it recorded (stored as a workflow artifact). It runs
  # only when rollback failed. Compensation restores the known-good
  # pre-rollback state, so it is deliberately NOT behind the protected
  # `production` environment approval gate — a failing rollback must restore
  # itself automatically, never wait for another approval. The database is
  # never reversed (Decision 8).
  compensate:
    needs: rollback
    if: failure() && needs.rollback.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # actions/checkout@v4 (11d5960a326750d5838078e36cf38b85af677262)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # aws-actions/configure-aws-credentials@v4 (ff717079ee2060e4bcee96c4779b553acc87447c)
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: arn:aws:iam::799111666795:role/github-actions-onlineshop
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure mandatory AWS CLI profile
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile dpm-profile
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile dpm-profile
          aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile dpm-profile
          aws sts get-caller-identity --profile dpm-profile --region eu-north-1

      - name: Download the pre-rollback snapshot
        # actions/download-artifact@v4 (fa0a91b85d4f404e444e00e005971372dc801d16)
        # The snapshot was uploaded by the rollback job; on failure the
        # compensate job restores exactly those bytes (Decision 13).
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: production-snapshot
          path: snapshot
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Restore from the pre-rollback snapshot
        run: |
          [ -f snapshot/production-snapshot.json ] || {
            echo "ERROR: pre-rollback snapshot is unavailable; stopping with a mixed-state incident record" >&2
            exit 1
          }
          # Every component the rollback could have mutated is compensated in
          # reverse deploy order. The frontend restore is a no-op when the live
          # root already matches the snapshot and a real restore (from the
          # previous immutable prefix) when it does not.
          bash "${{ env.RELEASE }}/bin/compensate-production.sh" \
            --snapshot snapshot/production-snapshot.json \
            --changed '["frontend","auth","items","apiGateway"]' \
            --profile dpm-profile --region ${{ env.AWS_REGION }}
        env:
          GITHUB_REPOSITORY: ${{ env.GITHUB_REPOSITORY }}
