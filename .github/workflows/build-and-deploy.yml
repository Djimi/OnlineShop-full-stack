name: CI/CD Pipeline

on:
  push:
    branches:
      - 'feature/**'
      - 'main'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build, test, and push'
        required: true
        type: choice
        options:
          - auth
          - items
          - api-gateway
          - frontend
          - all

# No workflow-level concurrency: build jobs run in parallel per ref. The
# singleton staging mutation path is serialized at JOB level on `e2e-staging`
# with cancel-in-progress: false (Pass 3, subphase 3.2) so a newer `main` push
# can never race an older run's resume -> deploy -> e2e -> teardown cycle.

# Pass 3, subphase 3.3 least privilege: validation jobs (frontend, e2e-pr) are
# scoped at job level to `contents: read` (no id-token: write). The AWS-facing
# jobs still assume the single `github-actions-onlineshop` role here; the split
# candidate-build / promotion / production / rollback roles and policies in
# plans/AUTOMATIC-BUILDS-AND-DEPLOY/github-actions-role-layout.md are applied
# in the consolidated verification pass once the roles exist.

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REGISTRY: 799111666795.dkr.ecr.eu-north-1.amazonaws.com
  # Reusable release-contract scripts (Pass 3). All are invoked from the
  # repository root; release-critical Actions below are pinned by full commit
  # SHA with a version comment.
  RELEASE: plans/AUTOMATIC-BUILDS-AND-DEPLOY/release

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      auth: ${{ steps.resolve.outputs.auth }}
      items: ${{ steps.resolve.outputs.items }}
      api-gateway: ${{ steps.resolve.outputs.api-gateway }}
      frontend: ${{ steps.resolve.outputs.frontend }}
    steps:
      # Fetch 20 commits instead of the default shallow single commit so
      # dorny/paths-filter can find the merge-base with the base branch locally,
      # avoiding extra git fetch roundtrips (it auto-fetches more if needed).
      # actions/checkout@v4 (11d5960a326750d5838078e36cf38b85af677262)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 20

      # dorny/paths-filter@v3 (6852f92c20ea7fd3b0c25de3b5112db3a98da050)
      - uses: dorny/paths-filter@6852f92c20ea7fd3b0c25de3b5112db3a98da050
        id: filter
        with:
          filters: |
            auth:
              - 'Auth/**'
              - '.github/workflows/build-and-deploy.yml'
            items:
              - 'Items/**'
              - 'common/**'
              - '.github/workflows/build-and-deploy.yml'
            api-gateway:
              - 'api-gateway/**'
              - '.github/workflows/build-and-deploy.yml'
            frontend:
              - 'frontend/**'

      - name: Resolve final changes
        id: resolve
        env:
          RELEASE_DIR: ${{ env.RELEASE }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          DISPATCH_SERVICE: ${{ github.event.inputs.service }}
          FILTER_AUTH: ${{ steps.filter.outputs.auth }}
          FILTER_ITEMS: ${{ steps.filter.outputs.items }}
          FILTER_API_GATEWAY: ${{ steps.filter.outputs.api-gateway }}
          FILTER_FRONTEND: ${{ steps.filter.outputs.frontend }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch)
              case "$DISPATCH_SERVICE" in
                all|auth|items|api-gateway|frontend) ;;
                *) echo "ERROR: invalid workflow dispatch service" >&2; exit 1 ;;
              esac
              for component in auth items api-gateway frontend; do
                if [ "$DISPATCH_SERVICE" = all ] || [ "$DISPATCH_SERVICE" = "$component" ]; then
                  printf '%s=true\n' "$component" >> "$GITHUB_OUTPUT"
                else
                  printf '%s=false\n' "$component" >> "$GITHUB_OUTPUT"
                fi
              done
              ;;
            push|pull_request)
              ;;
            *) echo "ERROR: unsupported event $EVENT_NAME" >&2; exit 1 ;;
          esac
          if [ "$EVENT_NAME" = "push" ] && [ "$WORKFLOW_REF" = "refs/heads/main" ]; then
            echo "auth=true" >> "$GITHUB_OUTPUT"
            echo "items=true" >> "$GITHUB_OUTPUT"
            echo "api-gateway=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" != workflow_dispatch ]; then
            printf 'auth=%s\n' "$FILTER_AUTH" >> "$GITHUB_OUTPUT"
            printf 'items=%s\n' "$FILTER_ITEMS" >> "$GITHUB_OUTPUT"
            printf 'api-gateway=%s\n' "$FILTER_API_GATEWAY" >> "$GITHUB_OUTPUT"
            printf 'frontend=%s\n' "$FILTER_FRONTEND" >> "$GITHUB_OUTPUT"
          fi

  auth:
    needs: changes
    if: needs.changes.outputs.auth == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      # actions/checkout@v4 (11d5960a326750d5838078e36cf38b85af677262)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-java@v4 (d7793b545071e98d581d3bf084a51c3213318a07)
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          java-version: '25'
          distribution: 'temurin'

      # actions/cache@v4 (0057852bfaa89a56745cba8c7296529d2fc39830)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-auth-${{ hashFiles('Auth/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-auth-
            ${{ runner.os }}-maven-

      - name: Run tests with coverage
        working-directory: Auth
        run: chmod +x mvnw && ./mvnw verify

      - name: Upload test report
        if: always()
        # actions/upload-artifact@v4 (ea165f8d65b6e75b540449e92b4886f43607fa02)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: auth-test-report
          path: Auth/target/reporting-output/
          if-no-files-found: ignore

      # aws-actions/configure-aws-credentials@v4 (ff717079ee2060e4bcee96c4779b553acc87447c)
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        if: success() && github.event_name != 'pull_request'
        with:
          role-to-assume: arn:aws:iam::799111666795:role/github-actions-onlineshop
          aws-region: ${{ env.AWS_REGION }}

      # aws-actions/amazon-ecr-login@v2 (d539f0932e70871a027e9d5a9d8fc38589180a64)
      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64
        if: success() && github.event_name != 'pull_request'

      - name: Compute Docker tags
        id: tags
        if: success()
        env:
          RELEASE_DIR: ${{ env.RELEASE }}
          ECR_REGISTRY_VALUE: ${{ env.ECR_REGISTRY }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
          COMPONENT_REPOSITORY: onlineshop-auth
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          source "$RELEASE_DIR/bin/release-input.sh"
          case "$WORKFLOW_EVENT" in
            push|workflow_dispatch) rl_assert_ci_ref "$WORKFLOW_REF" || exit 1 ;;
            pull_request) rl_assert_ci_pr_ref "$WORKFLOW_REF" || exit 1 ;;
            *) echo "invalid workflow event" >&2; exit 1 ;;
          esac
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid commit SHA" >&2; exit 1; }
          SHA_TAG="$ECR_REGISTRY_VALUE/$COMPONENT_REPOSITORY:sha-$WORKFLOW_SHA"
          ALL_TAGS="$SHA_TAG"
          if [[ "$WORKFLOW_EVENT" != "pull_request" && "$WORKFLOW_REF" == refs/heads/feature/* ]]; then
            BRANCH_NAME=$(printf '%s' "${WORKFLOW_REF#refs/heads/}" | tr '/' '-')
            BRANCH_TAG="$ECR_REGISTRY_VALUE/$COMPONENT_REPOSITORY:branch-$BRANCH_NAME"
            ALL_TAGS="$SHA_TAG,$BRANCH_TAG"
          elif [[ "$WORKFLOW_EVENT" != "pull_request" && "$WORKFLOW_REF" = "refs/heads/main" ]]; then
            ALL_TAGS="$SHA_TAG,$ECR_REGISTRY_VALUE/$COMPONENT_REPOSITORY:main-latest"
          fi
          printf 'tags=%s\n' "$ALL_TAGS" >> "$GITHUB_OUTPUT"

      - name: Compute OCI labels
        id: labels
        if: success()
        env:
          RELEASE_DIR: ${{ env.RELEASE }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          source "$RELEASE_DIR/bin/release-input.sh"
          case "$WORKFLOW_EVENT" in
            push|workflow_dispatch) rl_assert_ci_ref "$WORKFLOW_REF" || exit 1 ;;
            pull_request) rl_assert_ci_pr_ref "$WORKFLOW_REF" || exit 1 ;;
            *) echo "invalid workflow event" >&2; exit 1 ;;
          esac
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid commit SHA" >&2; exit 1; }
          CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "labels<<GH_LABELS"
            echo "org.opencontainers.image.revision=$WORKFLOW_SHA"
            echo "org.opencontainers.image.source=https://github.com/$WORKFLOW_REPOSITORY"
            echo "org.opencontainers.image.created=$CREATED"
            echo "org.opencontainers.image.title=OnlineShop auth service"
            echo "org.onlineshop.component=auth"
            echo "org.onlineshop.build-run=$WORKFLOW_RUN_ID-$WORKFLOW_RUN_ATTEMPT"
            echo "org.onlineshop.producer.run-id=$WORKFLOW_RUN_ID"
            echo "org.onlineshop.producer.run-attempt=$WORKFLOW_RUN_ATTEMPT"
            echo "org.onlineshop.producer.event=$WORKFLOW_EVENT"
            echo "org.onlineshop.producer.ref=$WORKFLOW_REF"
            echo "GH_LABELS"
          } >> "$GITHUB_OUTPUT"

      # docker/setup-buildx-action@v3 (8d2750c68a42422c14e847fe6c8ac0403b4cbd6f)
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        if: success()

      # Idempotent sha-<full-sha> publishing (Pass 3, Decision 11): reuse a
      # trusted canonical image instead of pushing rebuilt bytes. Runs after
      # buildx setup so image-labels.sh can use `docker buildx imagetools`.
      - name: Resolve candidate image publishing
        id: publish
        if: success() && github.event_name != 'pull_request'
        env:
          RELEASE_DIR: ${{ env.RELEASE }}
          AWS_REGION_VALUE: ${{ env.AWS_REGION }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          ECR_REPOSITORY: onlineshop-auth
          CANDIDATE_TAG: sha-${{ github.sha }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "$RELEASE_DIR/bin/publish-candidate-image.sh" --profile dpm-profile --region "$AWS_REGION_VALUE"

      # docker/build-push-action@v6 (10e90e3645eae34f1e60eeb005ba3a3d33f178e8)
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        if: success()
        with:
          context: Auth
          push: ${{ github.event_name != 'pull_request' && steps.publish.outputs.decision == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.labels.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  items:
    needs: changes
    if: needs.changes.outputs.items == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      # actions/checkout@v4 (11d5960a326750d5838078e36cf38b85af677262)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-java@v4 (d7793b545071e98d581d3bf084a51c3213318a07)
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          java-version: '25'
          distribution: 'temurin'

      # actions/cache@v4 (0057852bfaa89a56745cba8c7296529d2fc39830)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-items-${{ hashFiles('Items/pom.xml', 'common/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-items-
            ${{ runner.os }}-maven-

      - name: Build common dependency
        working-directory: common
        run: chmod +x mvnw && ./mvnw install -DskipTests

      - name: Run tests with coverage
        working-directory: Items
        run: chmod +x mvnw && ./mvnw verify

      - name: Upload test report
        if: always()
        # actions/upload-artifact@v4 (ea165f8d65b6e75b540449e92b4886f43607fa02)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: items-test-report
          path: Items/target/site/jacoco/
          if-no-files-found: ignore

      # aws-actions/configure-aws-credentials@v4 (ff717079ee2060e4bcee96c4779b553acc87447c)
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        if: success() && github.event_name != 'pull_request'
        with:
          role-to-assume: arn:aws:iam::799111666795:role/github-actions-onlineshop
          aws-region: ${{ env.AWS_REGION }}

      # aws-actions/amazon-ecr-login@v2 (d539f0932e70871a027e9d5a9d8fc38589180a64)
      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64
        if: success() && github.event_name != 'pull_request'

      - name: Compute Docker tags
        id: tags
        if: success()
        env:
          RELEASE_DIR: ${{ env.RELEASE }}
          ECR_REGISTRY_VALUE: ${{ env.ECR_REGISTRY }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
          COMPONENT_REPOSITORY: onlineshop-items
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          source "$RELEASE_DIR/bin/release-input.sh"
          case "$WORKFLOW_EVENT" in
            push|workflow_dispatch) rl_assert_ci_ref "$WORKFLOW_REF" || exit 1 ;;
            pull_request) rl_assert_ci_pr_ref "$WORKFLOW_REF" || exit 1 ;;
            *) echo "invalid workflow event" >&2; exit 1 ;;
          esac
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid commit SHA" >&2; exit 1; }
          SHA_TAG="$ECR_REGISTRY_VALUE/$COMPONENT_REPOSITORY:sha-$WORKFLOW_SHA"
          ALL_TAGS="$SHA_TAG"
          if [[ "$WORKFLOW_EVENT" != "pull_request" && "$WORKFLOW_REF" == refs/heads/feature/* ]]; then
            BRANCH_NAME=$(printf '%s' "${WORKFLOW_REF#refs/heads/}" | tr '/' '-')
            BRANCH_TAG="$ECR_REGISTRY_VALUE/$COMPONENT_REPOSITORY:branch-$BRANCH_NAME"
            ALL_TAGS="$SHA_TAG,$BRANCH_TAG"
          elif [[ "$WORKFLOW_EVENT" != "pull_request" && "$WORKFLOW_REF" = "refs/heads/main" ]]; then
            ALL_TAGS="$SHA_TAG,$ECR_REGISTRY_VALUE/$COMPONENT_REPOSITORY:main-latest"
          fi
          printf 'tags=%s\n' "$ALL_TAGS" >> "$GITHUB_OUTPUT"

      - name: Compute OCI labels
        id: labels
        if: success()
        env:
          RELEASE_DIR: ${{ env.RELEASE }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          source "$RELEASE_DIR/bin/release-input.sh"
          case "$WORKFLOW_EVENT" in
            push|workflow_dispatch) rl_assert_ci_ref "$WORKFLOW_REF" || exit 1 ;;
            pull_request) rl_assert_ci_pr_ref "$WORKFLOW_REF" || exit 1 ;;
            *) echo "invalid workflow event" >&2; exit 1 ;;
          esac
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid commit SHA" >&2; exit 1; }
          CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "labels<<GH_LABELS"
            echo "org.opencontainers.image.revision=$WORKFLOW_SHA"
            echo "org.opencontainers.image.source=https://github.com/$WORKFLOW_REPOSITORY"
            echo "org.opencontainers.image.created=$CREATED"
            echo "org.opencontainers.image.title=OnlineShop items service"
            echo "org.onlineshop.component=items"
            echo "org.onlineshop.build-run=$WORKFLOW_RUN_ID-$WORKFLOW_RUN_ATTEMPT"
            echo "org.onlineshop.producer.run-id=$WORKFLOW_RUN_ID"
            echo "org.onlineshop.producer.run-attempt=$WORKFLOW_RUN_ATTEMPT"
            echo "org.onlineshop.producer.event=$WORKFLOW_EVENT"
            echo "org.onlineshop.producer.ref=$WORKFLOW_REF"
            echo "org.onlineshop.common-revision=$WORKFLOW_SHA"
            echo "GH_LABELS"
          } >> "$GITHUB_OUTPUT"

      # docker/setup-buildx-action@v3 (8d2750c68a42422c14e847fe6c8ac0403b4cbd6f)
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        if: success()

      # Idempotent sha-<full-sha> publishing (Pass 3, Decision 11): reuse a
      # trusted canonical image instead of pushing rebuilt bytes. Runs after
      # buildx setup so image-labels.sh can use `docker buildx imagetools`.
      - name: Resolve candidate image publishing
        id: publish
        if: success() && github.event_name != 'pull_request'
        env:
          RELEASE_DIR: ${{ env.RELEASE }}
          AWS_REGION_VALUE: ${{ env.AWS_REGION }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          ECR_REPOSITORY: onlineshop-items
          CANDIDATE_TAG: sha-${{ github.sha }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "$RELEASE_DIR/bin/publish-candidate-image.sh" --profile dpm-profile --region "$AWS_REGION_VALUE"

      # docker/build-push-action@v6 (10e90e3645eae34f1e60eeb005ba3a3d33f178e8)
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        if: success()
        with:
          context: .
          file: Items/Dockerfile
          push: ${{ github.event_name != 'pull_request' && steps.publish.outputs.decision == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.labels.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  api-gateway:
    needs: changes
    if: needs.changes.outputs.api-gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      # actions/checkout@v4 (11d5960a326750d5838078e36cf38b85af677262)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-java@v4 (d7793b545071e98d581d3bf084a51c3213318a07)
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          java-version: '25'
          distribution: 'temurin'

      # actions/cache@v4 (0057852bfaa89a56745cba8c7296529d2fc39830)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-api-gateway-${{ hashFiles('api-gateway/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-api-gateway-
            ${{ runner.os }}-maven-

      - name: Run tests
        working-directory: api-gateway
        run: chmod +x mvnw && ./mvnw verify

      - name: Upload test report
        if: always()
        # actions/upload-artifact@v4 (ea165f8d65b6e75b540449e92b4886f43607fa02)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-gateway-test-report
          path: api-gateway/target/surefire-reports/
          if-no-files-found: ignore

      # aws-actions/configure-aws-credentials@v4 (ff717079ee2060e4bcee96c4779b553acc87447c)
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        if: success() && github.event_name != 'pull_request'
        with:
          role-to-assume: arn:aws:iam::799111666795:role/github-actions-onlineshop
          aws-region: ${{ env.AWS_REGION }}

      # aws-actions/amazon-ecr-login@v2 (d539f0932e70871a027e9d5a9d8fc38589180a64)
      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64
        if: success() && github.event_name != 'pull_request'

      - name: Compute Docker tags
        id: tags
        if: success()
        env:
          RELEASE_DIR: ${{ env.RELEASE }}
          ECR_REGISTRY_VALUE: ${{ env.ECR_REGISTRY }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
          COMPONENT_REPOSITORY: onlineshop-api-gateway
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          source "$RELEASE_DIR/bin/release-input.sh"
          case "$WORKFLOW_EVENT" in
            push|workflow_dispatch) rl_assert_ci_ref "$WORKFLOW_REF" || exit 1 ;;
            pull_request) rl_assert_ci_pr_ref "$WORKFLOW_REF" || exit 1 ;;
            *) echo "invalid workflow event" >&2; exit 1 ;;
          esac
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid commit SHA" >&2; exit 1; }
          SHA_TAG="$ECR_REGISTRY_VALUE/$COMPONENT_REPOSITORY:sha-$WORKFLOW_SHA"
          ALL_TAGS="$SHA_TAG"
          if [[ "$WORKFLOW_EVENT" != "pull_request" && "$WORKFLOW_REF" == refs/heads/feature/* ]]; then
            BRANCH_NAME=$(printf '%s' "${WORKFLOW_REF#refs/heads/}" | tr '/' '-')
            BRANCH_TAG="$ECR_REGISTRY_VALUE/$COMPONENT_REPOSITORY:branch-$BRANCH_NAME"
            ALL_TAGS="$SHA_TAG,$BRANCH_TAG"
          elif [[ "$WORKFLOW_EVENT" != "pull_request" && "$WORKFLOW_REF" = "refs/heads/main" ]]; then
            ALL_TAGS="$SHA_TAG,$ECR_REGISTRY_VALUE/$COMPONENT_REPOSITORY:main-latest"
          fi
          printf 'tags=%s\n' "$ALL_TAGS" >> "$GITHUB_OUTPUT"

      - name: Compute OCI labels
        id: labels
        if: success()
        env:
          RELEASE_DIR: ${{ env.RELEASE }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          source "$RELEASE_DIR/bin/release-input.sh"
          case "$WORKFLOW_EVENT" in
            push|workflow_dispatch) rl_assert_ci_ref "$WORKFLOW_REF" || exit 1 ;;
            pull_request) rl_assert_ci_pr_ref "$WORKFLOW_REF" || exit 1 ;;
            *) echo "invalid workflow event" >&2; exit 1 ;;
          esac
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid commit SHA" >&2; exit 1; }
          CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "labels<<GH_LABELS"
            echo "org.opencontainers.image.revision=$WORKFLOW_SHA"
            echo "org.opencontainers.image.source=https://github.com/$WORKFLOW_REPOSITORY"
            echo "org.opencontainers.image.created=$CREATED"
            echo "org.opencontainers.image.title=OnlineShop API gateway"
            echo "org.onlineshop.component=api-gateway"
            echo "org.onlineshop.build-run=$WORKFLOW_RUN_ID-$WORKFLOW_RUN_ATTEMPT"
            echo "org.onlineshop.producer.run-id=$WORKFLOW_RUN_ID"
            echo "org.onlineshop.producer.run-attempt=$WORKFLOW_RUN_ATTEMPT"
            echo "org.onlineshop.producer.event=$WORKFLOW_EVENT"
            echo "org.onlineshop.producer.ref=$WORKFLOW_REF"
            echo "GH_LABELS"
          } >> "$GITHUB_OUTPUT"

      # docker/setup-buildx-action@v3 (8d2750c68a42422c14e847fe6c8ac0403b4cbd6f)
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        if: success()

      # Idempotent sha-<full-sha> publishing (Pass 3, Decision 11): reuse a
      # trusted canonical image instead of pushing rebuilt bytes. Runs after
      # buildx setup so image-labels.sh can use `docker buildx imagetools`.
      - name: Resolve candidate image publishing
        id: publish
        if: success() && github.event_name != 'pull_request'
        env:
          RELEASE_DIR: ${{ env.RELEASE }}
          AWS_REGION_VALUE: ${{ env.AWS_REGION }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          ECR_REPOSITORY: onlineshop-api-gateway
          CANDIDATE_TAG: sha-${{ github.sha }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "$RELEASE_DIR/bin/publish-candidate-image.sh" --profile dpm-profile --region "$AWS_REGION_VALUE"

      # docker/build-push-action@v6 (10e90e3645eae34f1e60eeb005ba3a3d33f178e8)
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        if: success()
        with:
          context: api-gateway
          push: ${{ github.event_name != 'pull_request' && steps.publish.outputs.decision == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.labels.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pass 3, subphase 3.3: validation-only job. No `id-token: write`, so it can
    # never request AWS OIDC credentials, and no repository-write permissions.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      # actions/checkout@v4 (11d5960a326750d5838078e36cf38b85af677262)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-node@v4 (49933ea5288caeca8642d1e84afbd3f7d6820020)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pass 3, subphase 3.3: validation-only job. No `id-token: write`, so it can
    # never request AWS OIDC credentials, and no repository-write permissions.
    permissions:
      contents: read
    steps:
      # actions/checkout@v4 (11d5960a326750d5838078e36cf38b85af677262)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build and start isolated candidate stack
        run: docker compose up -d --build --wait auth-service items-service api-gateway

      # actions/setup-java@v4 (d7793b545071e98d581d3bf084a51c3213318a07)
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          java-version: '25'
          distribution: 'temurin'

      # actions/cache@v4 (0057852bfaa89a56745cba8c7296529d2fc39830)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-e2e-${{ hashFiles('e2e-tests/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-e2e-
            ${{ runner.os }}-maven-

      - name: Run blocking E2E tests
        working-directory: e2e-tests
        run: chmod +x mvnw && ./mvnw clean test

      - name: Capture container diagnostics
        if: failure()
        run: docker compose ps && docker compose logs --no-color auth-service items-service api-gateway

      - name: Stop isolated candidate stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  # Singleton staging mutation: resume -> deploy -> cloud E2E -> teardown, all
  # owned by this one job. Job-level concurrency (cancel-in-progress: false)
  # serializes main pushes so a newer run's resume can never race an older
  # run's teardown; teardown is always() and belongs to the same run that
  # created the environment.
  e2e-staging:
    needs: [auth, items, api-gateway, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-staging-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      validatedAt: ${{ steps.validate.outputs.validatedAt }}
    steps:
      # actions/checkout@v4 (11d5960a326750d5838078e36cf38b85af677262)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # aws-actions/configure-aws-credentials@v4 (ff717079ee2060e4bcee96c4779b553acc87447c)
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: arn:aws:iam::799111666795:role/github-actions-onlineshop
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure mandatory AWS CLI profile
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile dpm-profile
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile dpm-profile
          aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile dpm-profile
          aws sts get-caller-identity --profile dpm-profile --region eu-north-1

      - name: Resume isolated staging environment
        # Provision the clean database and ALB while keeping ECS stopped. The
        # deploy step must install this run's immutable image tag before any
        # service starts; otherwise resume could pull a stale/deleted tag from
        # the previous staging run and fail before deployment gets control.
        run: bash scripts/resume-staging.sh --on-demand --defer-services

      - name: Deploy to staging
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid commit SHA" >&2; exit 1; }
          chmod +x scripts/ci-deploy-staging.sh
          bash scripts/ci-deploy-staging.sh "sha-$WORKFLOW_SHA"

      # actions/setup-java@v4 (d7793b545071e98d581d3bf084a51c3213318a07)
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          java-version: '25'
          distribution: 'temurin'

      # actions/cache@v4 (0057852bfaa89a56745cba8c7296529d2fc39830)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-e2e-${{ hashFiles('e2e-tests/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-e2e-
            ${{ runner.os }}-maven-

      - name: Run E2E tests against staging
        env:
          STAGING_ALB_NAME: onlineshop-staging-v2-alb
        working-directory: e2e-tests
        run: |
          set -euo pipefail
          STAGING_URL=$(aws elbv2 describe-load-balancers \
            --names "$STAGING_ALB_NAME" \
            --profile dpm-profile \
            --region "$AWS_REGION" \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          echo "Testing against staging: $STAGING_URL"
          E2E_BASE_URL="http://$STAGING_URL" ./mvnw clean test

      - name: Record staging validation timestamp
        id: validate
        if: success()
        run: echo "validatedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Capture staging failure diagnostics
        if: failure()
        run: bash scripts/capture-staging-diagnostics.sh > staging-diagnostics.txt 2>&1 || true

      - name: Preserve staging failure diagnostics
        if: failure()
        # actions/upload-artifact@v4 (ea165f8d65b6e75b540449e92b4886f43607fa02)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          # v4 artifacts are immutable: include the attempt so a rerun that
          # fails staging again does not collide with the previous attempt.
          name: staging-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: staging-diagnostics.txt
          if-no-files-found: warn
          retention-days: 14

      # Teardown ownership: the run that resumed staging tears it down. This is
      # always() and serialized by the job concurrency group above.
      - name: Tear down isolated staging environment
        if: always()
        run: bash scripts/pause-staging.sh

  # One candidate evidence bundle per successful main push: emitted only after
  # Auth, Items, API Gateway, frontend, and the cloud staging E2E job all pass.
  candidate-evidence:
    needs: [auth, items, api-gateway, frontend, e2e-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        needs.auth.result == 'success' && needs.items.result == 'success' &&
        needs.api-gateway.result == 'success' && needs.frontend.result == 'success' &&
        needs.e2e-staging.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      BUNDLE_DIR: candidate-evidence
      ARTIFACT_NAME: candidate-evidence-${{ github.sha }}-${{ github.run_attempt }}
      SYFT_CACHE_DIR: /tmp/onlineshop-syft
    steps:
      # actions/checkout@v4 (11d5960a326750d5838078e36cf38b85af677262)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-python@v5 (a26af69be951a213d495a4c3e4e4022e16d87065)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'

      - name: Install release-contract dependencies
        env:
          RELEASE_DIR: ${{ env.RELEASE }}
        run: python -m pip install --disable-pip-version-check -q -r "$RELEASE_DIR/requirements.txt"

      # actions/setup-node@v4 (49933ea5288caeca8642d1e84afbd3f7d6820020)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # aws-actions/configure-aws-credentials@v4 (ff717079ee2060e4bcee96c4779b553acc87447c)
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: arn:aws:iam::799111666795:role/github-actions-onlineshop
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure mandatory AWS CLI profile
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile dpm-profile
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile dpm-profile
          aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile dpm-profile
          aws sts get-caller-identity --profile dpm-profile --region eu-north-1

      # aws-actions/amazon-ecr-login@v2 (d539f0932e70871a027e9d5a9d8fc38589180a64)
      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64

      # docker/setup-buildx-action@v3 (8d2750c68a42422c14e847fe6c8ac0403b4cbd6f)
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Resolve backend digests
        id: digests
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          RELEASE_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid commit SHA" >&2; exit 1; }
          for entry in "auth:AUTH_DIGEST" "items:ITEMS_DIGEST" "api-gateway:GATEWAY_DIGEST"; do
            repo="${entry%%:*}"
            var="${entry##*:}"
            digest=$(aws ecr describe-images --profile dpm-profile --region "$RELEASE_REGION" \
              --repository-name "onlineshop-$repo" \
              --image-ids "imageTag=sha-$WORKFLOW_SHA" \
              --query 'imageDetails[0].imageDigest' \
              --output text)
            echo "${var}=${digest}" >> "$GITHUB_ENV"
            echo "onlineshop-$repo sha-$WORKFLOW_SHA -> $digest"
          done

      - name: Verify canonical producer set
        env:
          RELEASE_DIR: ${{ env.RELEASE }}
          WORKFLOW_SHA: ${{ github.sha }}
          RELEASE_REGISTRY: ${{ env.ECR_REGISTRY }}
          RELEASE_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          bash "$RELEASE_DIR/bin/verify-producer-set.sh" \
            --sha "$WORKFLOW_SHA" \
            --registry "$RELEASE_REGISTRY" \
            --profile dpm-profile --region "$RELEASE_REGION"

      - name: Read canonical producer identity
        id: producer
        env:
          RELEASE_DIR: ${{ env.RELEASE }}
          RELEASE_REGISTRY: ${{ env.ECR_REGISTRY }}
          WORKFLOW_SHA: ${{ github.sha }}
          RELEASE_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          RECORD=$(bash "$RELEASE_DIR/bin/image-labels.sh" \
            --registry "$RELEASE_REGISTRY" --repository onlineshop-auth \
            --tag "sha-$WORKFLOW_SHA" --profile dpm-profile --region "$RELEASE_REGION")
          echo "producer-run-id=$(printf '%s' "$RECORD" | jq -r '.labels["org.onlineshop.producer.run-id"]')" >> "$GITHUB_OUTPUT"
          echo "producer-run-attempt=$(printf '%s' "$RECORD" | jq -r '.labels["org.onlineshop.producer.run-attempt"]')" >> "$GITHUB_OUTPUT"

      - name: Build frontend for the candidate artifact (VITE_API_URL='')
        working-directory: frontend
        run: |
          npm ci
          VITE_API_URL='' npm run build

      - name: Package frontend candidate archive
        env:
          RELEASE_DIR: ${{ env.RELEASE }}
          BUNDLE: ${{ env.BUNDLE_DIR }}
        run: bash "$RELEASE_DIR/bin/package-frontend.sh" --dist frontend/dist --out "$BUNDLE"

      - name: Generate frontend SBOM
        env:
          RELEASE_DIR: ${{ env.RELEASE }}
          BUNDLE: ${{ env.BUNDLE_DIR }}
        run: bash "$RELEASE_DIR/bin/generate-sbom.sh" --target "dir:frontend/dist" --output "$BUNDLE/frontend.spdx.json"

      - name: Generate Auth SBOM
        env:
          RELEASE_DIR: ${{ env.RELEASE }}
          BUNDLE: ${{ env.BUNDLE_DIR }}
          REGISTRY: ${{ env.ECR_REGISTRY }}
          DIGEST: ${{ env.AUTH_DIGEST }}
        run: bash "$RELEASE_DIR/bin/generate-sbom.sh" --target "registry:$REGISTRY/onlineshop-auth@$DIGEST" --output "$BUNDLE/auth.spdx.json"

      - name: Generate Items SBOM
        env:
          RELEASE_DIR: ${{ env.RELEASE }}
          BUNDLE: ${{ env.BUNDLE_DIR }}
          REGISTRY: ${{ env.ECR_REGISTRY }}
          DIGEST: ${{ env.ITEMS_DIGEST }}
        run: bash "$RELEASE_DIR/bin/generate-sbom.sh" --target "registry:$REGISTRY/onlineshop-items@$DIGEST" --output "$BUNDLE/items.spdx.json"

      - name: Generate API Gateway SBOM
        env:
          RELEASE_DIR: ${{ env.RELEASE }}
          BUNDLE: ${{ env.BUNDLE_DIR }}
          REGISTRY: ${{ env.ECR_REGISTRY }}
          DIGEST: ${{ env.GATEWAY_DIGEST }}
        run: bash "$RELEASE_DIR/bin/generate-sbom.sh" --target "registry:$REGISTRY/onlineshop-api-gateway@$DIGEST" --output "$BUNDLE/api-gateway.spdx.json"

      - name: Record test conclusions
        env:
          AUTH_RESULT: ${{ needs.auth.result }}
          ITEMS_RESULT: ${{ needs.items.result }}
          API_GATEWAY_RESULT: ${{ needs.api-gateway.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          E2E_STAGING_RESULT: ${{ needs.e2e-staging.result }}
        run: |
          set -euo pipefail
          jq -n \
            --arg auth "$AUTH_RESULT" \
            --arg items "$ITEMS_RESULT" \
            --arg apiGateway "$API_GATEWAY_RESULT" \
            --arg frontend "$FRONTEND_RESULT" \
            --arg e2eStaging "$E2E_STAGING_RESULT" \
            '{auth: $auth, items: $items, apiGateway: $apiGateway, frontend: $frontend, e2eStaging: $e2eStaging}' \
            > conclusions.json

      - name: Emit candidate evidence bundle
        env:
          RELEASE_DIR: ${{ env.RELEASE }}
          BUNDLE: ${{ env.BUNDLE_DIR }}
          ARTIFACT: ${{ env.ARTIFACT_NAME }}
          AUTH_IMAGE_DIGEST: ${{ env.AUTH_DIGEST }}
          ITEMS_IMAGE_DIGEST: ${{ env.ITEMS_DIGEST }}
          GATEWAY_IMAGE_DIGEST: ${{ env.GATEWAY_DIGEST }}
          VALIDATED_AT: ${{ needs.e2e-staging.outputs.validatedAt }}
          PRODUCER_RUN_ID: ${{ steps.producer.outputs.producer-run-id }}
          PRODUCER_RUN_ATTEMPT: ${{ steps.producer.outputs.producer-run-attempt }}
        run: |
          set -euo pipefail
          bash "$RELEASE_DIR/bin/emit-candidate-evidence.sh" \
            --bundle-dir "$BUNDLE" \
            --artifact-name "$ARTIFACT" \
            --auth-digest "$AUTH_IMAGE_DIGEST" \
            --items-digest "$ITEMS_IMAGE_DIGEST" \
            --api-gateway-digest "$GATEWAY_IMAGE_DIGEST" \
            --frontend-sha256 "$(jq -r '.sha256' "$BUNDLE/frontend-package.json")" \
            --validated-at "$VALIDATED_AT" \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --conclusions conclusions.json

      - name: Upload candidate evidence bundle
        id: upload
        # actions/upload-artifact@v4 (ea165f8d65b6e75b540449e92b4886f43607fa02)
        # v4 returns artifact-id, artifact-url and artifact-digest (the GitHub
        # service-reported SHA-256 of the uploaded archive) as step outputs.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.BUNDLE_DIR }}
          retention-days: 30

      - name: Record candidate evidence artifact identity
        env:
          RELEASE_DIR: ${{ env.RELEASE }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          UPLOAD_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          UPLOAD_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          UPLOAD_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT: ${{ env.ARTIFACT_NAME }}
        run: |
          set -euo pipefail
          bash "$RELEASE_DIR/bin/record-artifact.sh" \
            --run-id "$WORKFLOW_RUN_ID" \
            --run-attempt "$WORKFLOW_RUN_ATTEMPT" \
            --artifact-id "$UPLOAD_ARTIFACT_ID" \
            --artifact-url "$UPLOAD_ARTIFACT_URL" \
            --artifact-digest "$UPLOAD_ARTIFACT_DIGEST" \
            --artifact-name "$ARTIFACT" \
            --output artifact-id.json

      - name: Upload artifact ID record
        # The bundle's own artifact ID/digest cannot live inside the bundle it
        # describes (circular self-checksum), so the pointer artifact above is
        # the durable external reference consumed by promotion.
        # actions/upload-artifact@v4 (ea165f8d65b6e75b540449e92b4886f43607fa02)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-artifact-id-${{ github.sha }}-${{ github.run_attempt }}
          path: artifact-id.json
          retention-days: 30
