name: AWS role boundary proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundaries:
    name: Read-only ${{ matrix.role }} boundaries
    if: github.ref == 'refs/heads/main'
    environment: aws-testing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        role: [publisher, operator]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ matrix.role == 'publisher' && vars.AWS_TESTING_PUBLISHER_ROLE || vars.AWS_TESTING_OPERATOR_ROLE }}
          aws-region: eu-north-1
          allowed-account-ids: ${{ vars.AWS_TESTING_ACCOUNT_ID }}
          role-session-name: boundary-${{ matrix.role }}-${{ github.run_id }}
          role-duration-seconds: 900
          mask-aws-account-id: true
      - name: Verify live allowed and denied reads without retaining raw data
        env:
          PROOF_ROLE: ${{ matrix.role }}
          AWS_TESTING_ACCOUNT_ID: ${{ vars.AWS_TESTING_ACCOUNT_ID }}
          AWS_TESTING_STATE_BUCKET: ${{ vars.AWS_TESTING_STATE_BUCKET }}
          AWS_TESTING_SECRET_ARN: ${{ vars.AWS_TESTING_SECRET_ARN }}
        run: |
          python3 scripts/aws-boundary-proof.py --role "$PROOF_ROLE" --output "$RUNNER_TEMP/proof.json"
          cat "$RUNNER_TEMP/proof.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aws-boundaries-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof.json
          if-no-files-found: error
          retention-days: 14
